name: Update profile README

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-profile.yml'
      - 'scripts/update_profile.py'
      - 'README.md'
      - 'assets/**'

permissions:
  contents: write

concurrency:
  group: profile-readme-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'jxxzy/jxxzy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out default branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: main
          fetch-depth: 1
      - name: Test generator
        run: python3 scripts/update_profile.py --self-test
      - name: Refresh and publish public repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/update_profile.py --self-test
            python3 scripts/update_profile.py
            python3 scripts/update_profile.py --check-assets
            if [[ -z "$(git status --porcelain -- README.md assets/profile-analytics.svg)" ]]; then
              echo 'No generated changes'
              exit 0
            fi
            git add -- README.md assets/profile-analytics.svg
            git commit -m 'docs: refresh public profile analytics'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo 'Unable to publish after three attempts' >&2
          exit 1
      - name: Check optional external contribution cards
        run: python3 scripts/update_profile.py --probe-external
